<!DOCTYPE html>
<html>
<head>
    <title>Définir le mot de passe</title>
</head>
<body>
    <h2>Définissez votre nouveau mot de passe</h2>
    
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Enregistrer le mot de passe</button>
        </form>
    {% else %}
        <p>Ce lien d'invitation est invalide ou a expiré.</p>
    {% endif %}
</body>
</html>
